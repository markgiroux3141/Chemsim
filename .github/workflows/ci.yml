# The full suite on every push, so it no longer waits for somebody to ask for
# thirty minutes of the user's machine. Windows, because every pin in tests/ was
# measured on Windows, and a platform's floating-point noise is not a finding.
#
# A session reads the result with `python tools/ci_status.py`, which needs no
# token: the failing test ids are published as job annotations below.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: check.ps1 -Full
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_docs and cadence read the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt -e .
      - run: ./check.ps1 -Full
        shell: pwsh

  suite:
    name: pytest (full suite)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt -e .
      # worksteal, not loadfile: under loadfile the first run took 32.9 min on
      # four workers because one module was the critical path. A module-scoped
      # fixture is rebuilt on each worker that steals from it, which is cheaper.
      - run: python -m pytest -q -n auto --dist worksteal --durations=0 --junitxml=junit.xml
        shell: pwsh
      - name: annotate failures and the slowest modules
        if: always()
        run: python .github/annotate_junit.py junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml
