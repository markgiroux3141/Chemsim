# The full suite on every push, so it no longer waits for somebody to ask for
# thirty minutes of the user's machine. Windows, because every pin in tests/ was
# measured on Windows, and a platform's floating-point noise is not a finding.
#
# A session reads the result with `python tools/ci_status.py`, which needs no
# token: the failing test ids are published as job annotations below.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: check.ps1 -Full
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_docs and cadence read the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt -e .
      - run: ./check.ps1 -Full
        shell: pwsh

  suite:
    name: pytest (full suite)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install -r .github/requirements-ci.txt -e .
      # loadfile keeps each module on one worker, so a module-scoped fixture is
      # built once. The suite is ~10 min on the user's machine and ran past 150
      # here twice with no report, so the step has its own limit and the
      # reportlog is written test by test: whatever kills the run, the next
      # step can name what started and never finished.
      - run: python -m pytest -q -n auto --dist loadfile --timeout 900 --durations=0 --junitxml=junit.xml --report-log=reportlog.jsonl
        shell: pwsh
        timeout-minutes: 110
      - name: annotate failures, the slowest modules, and anything unfinished
        if: always()
        run: python .github/annotate_junit.py junit.xml reportlog.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml
